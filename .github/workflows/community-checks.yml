name: Community checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - run: python -m pip install --disable-pip-version-check -r requirements-experiments.txt
      - name: Software and adversarial result tests
        run: python -B -m unittest discover -s tests -p "test_community_*.py" -v
      - name: Report actual platform and resources
        run: python scripts/experiments/check_env.py
  submitted-results:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Use only the trusted base verifier
        shell: bash
        run: |
          if [ -d candidate/experiments/community/results/submissions ]; then
            test -f trusted/scripts/experiments/check_submissions.py
            python -m pip install --disable-pip-version-check -r trusted/requirements-experiments.txt
            python -B trusted/scripts/experiments/check_submissions.py --candidate candidate --data-root "$RUNNER_TEMP/community-data" --output "$RUNNER_TEMP/result-checks"
          else
            echo "NO_SUBMISSIONS: no scientific result acceptance was performed."
          fi
      - name: Retain consistency reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: result-consistency-reports
          path: ${{ runner.temp }}/result-checks/*.json
          if-no-files-found: ignore
          retention-days: 30
